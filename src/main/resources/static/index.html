<!DOCTYPE html>
<!-- 
crie um arquivo index.html (HTML, CSS e JavaScript puros e design minimo) para servir de 
frontend para uma API REST spring boot, com formularios com endpoints:

 POST /pedal (body JSON sem id)
 GET /pedal?nome={nome}
 GET /pedal/{id}
 PATCH /pedal/{id} (body JSON incompleto onde campos nulos nao sao alterados)
 DELETE /pedal?nome={nome}

 Pedal { id: Integer, nome: String (máx. 48), ano: Integer, efeito: String, marca: String }.  
 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Pedais - API REST</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --muted: #6c757d;
      --primary: #212529;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .base-url {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .base-url input {
      width: 220px;
      padding: 0.35rem 0.6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .method {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: #e9ecef;
    }

    .card p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    input {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      padding: 0.6rem 1rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.25rem;
    }

    button:hover {
      opacity: 0.9;
    }

    button.danger {
      background: var(--danger);
    }

    .response-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
    }

    #status-badge {
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #e9ecef;
    }

    pre {
      background: #f1f3f5;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>API Pedais</h1>
      <div class="base-url">
        <label for="api-url" style="flex-direction: row; align-items: center;">Base URL:</label>
        <input type="text" id="api-url" value="http://localhost:8080">
      </div>
    </header>

    <div class="grid">
      <!-- POST /pedal -->
      <div class="card">
        <h2><span class="method">POST</span> /pedal</h2>
        <p>Cadastrar novo pedal</p>
        <form id="form-post">
          <label>
            Nome (máx. 48) *
            <input type="text" name="nome" maxlength="48" required>
          </label>
          <label>
            Ano *
            <input type="number" name="ano" required>
          </label>
          <label>
            Efeito *
            <input type="text" name="efeito" required>
          </label>
          <label>
            Marca *
            <input type="text" name="marca" required>
          </label>
          <button type="submit">Criar Pedal</button>
        </form>
      </div>

      <!-- PATCH /pedal/{id} -->
      <div class="card">
        <h2><span class="method">PATCH</span> /pedal/{id}</h2>
        <p>Atualizar parcialmente (campos vazios são enviados como null)</p>
        <form id="form-patch">
          <label>
            ID do Pedal *
            <input type="number" name="id" required>
          </label>
          <label>
            Nome (máx. 48)
            <input type="text" name="nome" maxlength="48">
          </label>
          <label>
            Ano
            <input type="number" name="ano">
          </label>
          <label>
            Efeito
            <input type="text" name="efeito">
          </label>
          <label>
            Marca
            <input type="text" name="marca">
          </label>
          <button type="submit">Atualizar Pedal</button>
        </form>
      </div>

      <!-- GET /pedal?nome={nome} -->
      <div class="card">
        <h2><span class="method">GET</span> /pedal?nome=</h2>
        <p>Buscar pedal por nome</p>
        <form id="form-get-nome">
          <label>
            Nome *
            <input type="text" name="nome" maxlength="48" required>
          </label>
          <button type="submit">Buscar por Nome</button>
        </form>
      </div>

      <!-- GET /pedal/{id} -->
      <div class="card">
        <h2><span class="method">GET</span> /pedal/{id}</h2>
        <p>Buscar pedal por ID</p>
        <form id="form-get-id">
          <label>
            ID *
            <input type="number" name="id" required>
          </label>
          <button type="submit">Buscar por ID</button>
        </form>
      </div>

      <!-- DELETE /pedal?nome={nome} -->
      <div class="card">
        <h2><span class="method">DELETE</span> /pedal?nome=</h2>
        <p>Remover pedal por nome</p>
        <form id="form-delete-nome">
          <label>
            Nome *
            <input type="text" name="nome" maxlength="48" required>
          </label>
          <button type="submit" class="danger">Deletar por Nome</button>
        </form>
      </div>
    </div>

    <!-- Resposta da API -->
    <div class="response-area">
      <div class="response-header">
        <span>Resposta da API</span>
        <span id="status-badge">Aguardando requisição...</span>
      </div>
      <pre id="output">{}</pre>
    </div>
  </div>

  <script>
    const getBaseUrl = () => document.getElementById('api-url').value.replace(/\/$/, '');
    const outputEl = document.getElementById('output');
    const statusBadge = document.getElementById('status-badge');

    async function sendRequest(endpoint, options = {}) {
      const url = `${getBaseUrl()}${endpoint}`;
      statusBadge.textContent = 'Carregando...';
      outputEl.textContent = '';

      try {
        const response = await fetch(url, {
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          ...options
        });

        statusBadge.textContent = `Status: ${response.status} ${response.statusText}`;

        const text = await response.text();
        try {
          const json = JSON.parse(text);
          outputEl.textContent = JSON.stringify(json, null, 2);
        } catch {
          outputEl.textContent = text || '(Sem corpo de resposta)';
        }
      } catch (error) {
        statusBadge.textContent = 'Erro de Conexão';
        outputEl.textContent = `Falha ao conectar em ${url}\n\nDetalhes: ${error.message}\n(Verifique se o backend está rodando e se o CORS está habilitado no Spring Boot)`;
      }
    }

    // 1. POST /pedal
    document.getElementById('form-post').addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const body = {
        nome: formData.get('nome'),
        ano: Number(formData.get('ano')),
        efeito: formData.get('efeito'),
        marca: formData.get('marca')
      };

      sendRequest('/pedal', {
        method: 'POST',
        body: JSON.stringify(body)
      });
    });

    // 2. GET /pedal?nome={nome}
    document.getElementById('form-get-nome').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = new FormData(e.target).get('nome');
      const params = new URLSearchParams({ nome });
      sendRequest(`/pedal?${params.toString()}`, { method: 'GET' });
    });

    // 3. GET /pedal/{id}
    document.getElementById('form-get-id').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = new FormData(e.target).get('id');
      sendRequest(`/pedal/${encodeURIComponent(id)}`, { method: 'GET' });
    });

    // 4. PATCH /pedal/{id}
    document.getElementById('form-patch').addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const id = formData.get('id');

      const parseStr = (val) => val.trim() === '' ? null : val.trim();
      const parseIntOrNull = (val) => val.trim() === '' ? null : Number(val);

      const body = {
        nome: parseStr(formData.get('nome')),
        ano: parseIntOrNull(formData.get('ano')),
        efeito: parseStr(formData.get('efeito')),
        marca: parseStr(formData.get('marca'))
      };

      sendRequest(`/pedal/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        body: JSON.stringify(body)
      });
    });

    // 5. DELETE /pedal?nome={nome}
    document.getElementById('form-delete-nome').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = new FormData(e.target).get('nome');
      const params = new URLSearchParams({ nome });
      sendRequest(`/pedal?${params.toString()}`, { method: 'DELETE' });
    });
  </script>
</body>
</html>
